plugins {
  id 'java'
  id 'checkstyle'
  id 'org.springframework.boot' version '4.1.2'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.graalvm.buildtools.native' version '1.1.2'
  id 'org.cyclonedx.bom' version '3.5.1'
  id 'io.spring.javaformat' version '0.0.47'
}

gradle.startParameter.excludedTaskNames += [ "checkFormatAot", "checkFormatAotTest" ]

group = 'org.springframework.samples'
version = '4.0.0-SNAPSHOT'

java {
  toolchain {
    // JDK track: 25 (LTS, default) or 27. Set with -PjavaVersion=27 (compile-and-run.sh passes it via JDK_TRACK).
    languageVersion = JavaLanguageVersion.of((findProperty('javaVersion') ?: '25') as int)
  }
}

repositories {
  mavenCentral()
}

ext.checkstyleVersion = "12.3.1"
ext.springJavaformatCheckstyleVersion = "0.0.47"
ext.nohttpVersion = "0.0.11"
ext.webjarsLocatorLiteVersion = "1.1.3"
ext.webjarsFontawesomeVersion = "4.7.0"
ext.webjarsBootstrapVersion = "5.3.8"

def cracEnabled = project.hasProperty('crac') && project.property('crac') == 'true'

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-webmvc'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'javax.cache:cache-api'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'

  if (cracEnabled) {
      implementation "org.crac:crac:1.5.0"
  }

  runtimeOnly 'org.springframework.boot:spring-boot-starter-actuator'
  runtimeOnly "org.webjars:webjars-locator-lite:${webjarsLocatorLiteVersion}"
  runtimeOnly "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  runtimeOnly "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"
  runtimeOnly 'com.github.ben-manes.caffeine:caffeine'
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.boot:spring-boot-docker-compose'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-mysql'
  checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${springJavaformatCheckstyleVersion}"
  checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
  checkstyle "io.spring.nohttp:nohttp-checkstyle:${nohttpVersion}"
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.named("cyclonedxDirectBom").configure {
  dependsOn("compileJava")
  skipConfigs = [".*[Tt]est.*"]
}

checkstyle {
  configDirectory = project.file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

// nohttp: flags http:// URLs in all project files. Registered here instead of with the
// io.spring.nohttp Gradle plugin (0.0.11, the latest): that plugin's checkstyleNohttp task holds
// the Project in a reports callback, so it breaks the configuration cache. Same files, config and
// report locations as the plugin's task; the check itself comes from nohttp-checkstyle above.
def checkstyleNohttp = tasks.register("checkstyleNohttp", Checkstyle) {
  description = "Checks for illegal uses of http://"
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  source = fileTree(projectDir) {
    exclude "build/**", ".git/**", ".gradle/**", "buildSrc/.gradle/**", ".idea/**",
      "**/*.class", "**/*.hprof", "**/*.jar", "**/*.jpg", "**/*.jks",
      "**/spring.handlers", "**/spring.schemas", "**/spring.tooling"
  }
  classpath = files()
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
  reports {
    html.outputLocation = layout.buildDirectory.file("reports/checkstyleNohttp/nohttp.html")
    xml.outputLocation = layout.buildDirectory.file("reports/checkstyleNohttp/nohttp.xml")
    sarif.outputLocation = layout.buildDirectory.file("reports/checkstyleNohttp/nohttp.sarif")
  }
}
tasks.named("check").configure { dependsOn(checkstyleNohttp) }

tasks.named("formatMain").configure { dependsOn("checkstyleMain") }
tasks.named("formatMain").configure { dependsOn("checkstyleNohttp") }

tasks.named("formatTest").configure { dependsOn("checkstyleTest") }
tasks.named("formatTest").configure { dependsOn("checkstyleNohttp") }

checkstyleAot.enabled = false
checkstyleAotTest.enabled = false

checkFormatAot.enabled = false
checkFormatAotTest.enabled = false

formatAot.enabled = false
formatAotTest.enabled = false
